name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets are used: no GROQ_API_KEY exists in CI, so no AI provider request can be made.
jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus # throwaway CI database, same local-only credentials as docker-compose.yml
          POSTGRES_DB: campussearch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U campus -d campussearch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # requirements-ml.txt (PyTorch) and requirements-ocr.txt are optional and not needed:
      # tests use a fake embedder, and the real-OCR test skips without its packages.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  evaluation:
    name: Evaluation (offline tests)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Metric and citation-check tests; real-corpus regressions skip without a database.
      - name: Run evaluation tests
        run: python -m pytest -q evaluation

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (includes type check)
        run: npm run build
