services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus # shortcut: local dev credentials only, move to .env before any deploy
      POSTGRES_DB: campussearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U campus -d campussearch"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
